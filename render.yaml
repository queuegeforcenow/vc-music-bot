services:
  - type: web
    name: discord-auto-bgm-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discord-bgm-db
          property: connectionString

databases:
  - name: discord-bgm-db
    plan: free
    databaseName: discord_bgm_bot
    user: discord_bgm_bot
